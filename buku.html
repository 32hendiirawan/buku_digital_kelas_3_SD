<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Digital Kelas 3 SD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="cover/favicon.png">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #1e293b;         
            --inner-cover-color: #2c3e50;
            --paper-color: #fcfbf9;      
        }

        body {
            background-image: url('cover/bg.jpg');
            background-size: cover;
            background-position: center;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
        }

        body:fullscreen {
            background-image: url('cover/bg.jpg');
            background-size: cover;
            background-position: center;
        }

        .screen-container-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            position: relative;
            width: 100%;
            background-image: url('cover/bg.jpg');
            background-size: cover;
            background-position: center;
        }
        .screen-container-wrapper.zoom-mode { display: block; overflow: hidden; cursor: grab; }

        .zoom-shield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 40; display: none; background: transparent;
        }
        .zoom-shield.active { display: block; cursor: grab; }

        /* PERBAIKAN UKURAN: Memaksimalkan area buku dengan memperlebar persentase viewport */
        .screen-container {
            width: 98vw;
            height: calc(100% - 10px);
            max-width: calc((100vh - 75px) * (4/3)); 
            max-height: calc(98vw * (3/4)); 
            aspect-ratio: 4 / 3; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform-origin: top left;
            transition: transform 0.3s ease-in-out, margin 0.3s ease-in-out;
        }
        .screen-container.zoomed { transform: scale(2); margin-left: 0; margin-top: 0; }

        .flipbook-wrapper { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        
        #book-container { 
            display: none; 
            background-color: transparent !important; 
            transition: transform 0.4s ease-in-out;
        }

        .page { width: 100%; height: 100%; overflow: hidden; user-select: none; display: flex; flex-direction: column; position: relative; }
        
        /* PADDING TEPI RESPONSIF % DAN EFEK BUKU ASLI DI TENGAH */
        .page.cover-front { 
            background-color: #34495e; 
            padding: 1.2% 0.5% 1.2% 1.5%; /* Tipis di kanan (bagian tengah buku) */
            box-shadow: 0 10px 25px rgba(0,0,0,0.4) !important; 
        }
        .page.cover-back { 
            background-color: #34495e; 
            padding: 1.2% 1.5% 1.2% 0.5%; /* Tipis di kiri (bagian tengah buku) */
            box-shadow: 0 10px 25px rgba(0,0,0,0.4) !important; 
        }
        
        .cover-container { width: 100%; height: 100%; border: 2px double rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; }

        /* Menghilangkan sekat tengah keras dan menggantinya dengan gradasi bayangan lipatan halus */
/* Menghilangkan sekat tengah keras dan merapatkan halaman kiri-kanan */
        .page.halaman-isi { 
            background-color: var(--inner-cover-color); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); 
        }
        
        /* HALAMAN KIRI SECARA VISUAL (Elemen Genap di DOM) */
        /* Padding kanan di-0-kan agar rapat ke tengah */
        .page.halaman-isi:nth-child(even) {
            padding: 1% 0% 1% 1.2%; 
        }
        
        /* HALAMAN KANAN SECARA VISUAL (Elemen Ganjil di DOM) */
        /* Padding kiri di-0-kan agar rapat ke tengah */
        .page.halaman-isi:nth-child(odd) {
            padding: 1% 1.2% 1% 0%; 
        }

        .page-isi-konten { 
            width: 100%; 
            height: 100%; 
            background-color: var(--paper-color); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            border-radius: 0px; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        /* EFEK GRADASI BAYANGAN TENGAH YANG BENAR */
        
        /* Untuk Halaman Kiri: bayangan pekat di sisi kanan (menuju lipatan tengah) */
        .page.halaman-isi:nth-child(even) .page-isi-konten::after {
            content: ''; 
            position: absolute; 
            top: 0; 
            right: 0; 
            width: 30px; 
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.25) 100%);
            z-index: 5; 
            pointer-events: none;
        }
        
        /* Untuk Halaman Kanan: bayangan pekat di sisi kiri (menuju lipatan tengah) */
        .page.halaman-isi:nth-child(odd) .page-isi-konten::after {
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 30px; 
            height: 100%;
            background: linear-gradient(to left, rgba(0,0,0,0) 0%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.25) 100%);
            z-index: 5; 
            pointer-events: none;
        }

        canvas { width: 100% !important; height: 100% !important; object-fit: fill; display: block; }

        .page-skeleton {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite linear; z-index: 2;
            display: flex; justify-content: center; align-items: center;
        }
        .page.cover-front .page-skeleton, .page.cover-back .page-skeleton { background: linear-gradient(90deg, #2c3e50 25%, #34495e 50%, #2c3e50 75%); }
        .page-skeleton i { font-size: 2rem; color: #94a3b8; animation: spin 1s infinite linear; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .control-bar {
            width: 100%; height: 50px; background-color: #0f172a;
            display: flex; justify-content: center; align-items: center; gap: 6px; padding: 0 10px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3); z-index: 100; flex-shrink: 0;
        }
        .control-btn { background: none; border: none; color: #94a3b8; font-size: 1rem; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s; }
        .control-btn:hover:not(:disabled) { color: #f8fafc; background-color: #1e293b; }
        .control-btn:disabled { color: #334155; cursor: default; }

        .page-input-wrapper { display: flex; align-items: center; gap: 6px; color: #94a3b8; font-size: 0.9rem; margin: 0 5px; }
        .page-input-wrapper input { width: 45px; height: 28px; background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; text-align: center; font-weight: bold; }
        .control-divider { width: 1px; height: 18px; background-color: #334155; margin: 0 2px; }

        .loading-state {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 200; text-align: center; background-color: rgba(15, 23, 42, 0.95);
            padding: 25px 40px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .book-loader { position: relative; width: 50px; height: 38px; perspective: 150px; }
        .book-loader .book-page {
            position: absolute; left: 50%; top: 0; width: 50%; height: 100%;
            border: 2px solid #3b82f6; border-left: none; border-radius: 0 4px 4px 0;
            background-color: #1e293b; transform-origin: 0% 50%; animation: flipPage 2s infinite linear;
        }
        .book-loader .book-page:nth-child(1) { animation-delay: 0s; }
        .book-loader .book-page:nth-child(2) { animation-delay: -0.66s; }
        .book-loader .book-page:nth-child(3) { animation-delay: -1.33s; }
        .book-loader::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid #64748b; border-radius: 4px; }
        @keyframes flipPage { 0% { transform: rotateY(0deg); z-index: 3; } 50% { transform: rotateY(-180deg); z-index: 1; } 100% { transform: rotateY(-180deg); z-index: 1; } }

        @media (max-width: 768px) or (orientation: portrait) {
            .screen-container {
                width: 96vw;
                max-width: calc((100dvh - 105px) * (2/3)); 
                max-height: calc(96vw * (3/2));
                aspect-ratio: 2 / 3; 
            }
            .control-bar {
                height: 65px; 
                padding-bottom: env(safe-area-inset-bottom, 10px); 
                align-items: flex-start; 
                padding-top: 8px;
            }
            /* Reset padding tengah pada mode potret/single page mobile view */
            .page.halaman-isi:nth-child(odd), .page.halaman-isi:nth-child(even) { padding: 1%; }
            .page.halaman-isi:nth-child(odd) .page-isi-konten::after, .page.halaman-isi:nth-child(even) .page-isi-konten::after { display: none; }
        }
    </style>
</head>
<body>

    <div class="loading-state" id="loading">
        <div class="book-loader"><div class="book-page"></div><div class="book-page"></div><div class="book-page"></div></div>
        <div class="loading-text">Membuka Dokumen...</div>
    </div>

    <div class="screen-container-wrapper" id="zoom-viewport">
        <div id="zoom-shield" class="zoom-shield"></div>
        <div class="screen-container" id="screen-container">
            <div class="flipbook-wrapper">
                <div id="book-container"></div>
            </div>
        </div>
    </div>

    <div class="control-bar">
        <button class="control-btn" id="btn-library" title="Rak Buku"><i class="fa-solid fa-home"></i></button>
        <div class="control-divider"></div>
        <button class="control-btn" id="btn-home" title="Awal"><i class="fa-solid fa-backward-step"></i></button>
        <button class="control-btn" id="btn-prev" title="Kiri"><i class="fa-solid fa-chevron-left"></i></button>
        
        <div class="page-input-wrapper">
            <input type="number" id="input-page" value="1" min="1">
            <span>/ <span id="total-pages">0</span></span>
        </div>

        <button class="control-btn" id="btn-next" title="Kanan"><i class="fa-solid fa-chevron-right"></i></button>
        <button class="control-btn" id="btn-end" title="Akhir"><i class="fa-solid fa-forward-step"></i></button>
        
        <div class="control-divider"></div>
        <button class="control-btn" id="btn-zoom" title="Zoom"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button class="control-btn" id="btn-fullscreen" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetPdf = urlParams.get('file');

            if (!targetPdf) { window.location.href = 'index.html'; return; }

            const bookContainer = document.getElementById('book-container');
            const screenContainer = document.getElementById('screen-container');
            const zoomViewport = document.getElementById('zoom-viewport');
            const zoomShield = document.getElementById('zoom-shield');
            const loadingElement = document.getElementById('loading');
            
            const btnLibrary = document.getElementById('btn-library');
            const btnHome = document.getElementById('btn-home');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnEnd = document.getElementById('btn-end');
            const btnZoom = document.getElementById('btn-zoom');
            const btnFullscreen = document.getElementById('btn-fullscreen');
            const inputPage = document.getElementById('input-page');
            const totalPagesText = document.getElementById('total-pages');

            let isZoomed = false;
            let pageFlip = null;
            let totalPages = 0;
            let pdfDoc = null;
            const renderedPages = new Map(); 

            btnLibrary.onclick = () => { if(!isZoomed) window.location.href = 'index.html'; };

            loadAndInitializeContainer(targetPdf);

            async function loadAndInitializeContainer(pdfUrl) {
                try {
                    const loadingTask = pdfjsLib.getDocument(pdfUrl);
                    pdfDoc = await loadingTask.promise;
                    totalPages = pdfDoc.numPages;
                    totalPagesText.innerText = totalPages;
                    inputPage.max = totalPages;

                    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'page';
                        pageDiv.id = `page-container-${pageNum}`;

                        const skeleton = document.createElement('div');
                        skeleton.className = 'page-skeleton';
                        skeleton.innerHTML = '<i class="fa-solid fa-spinner"></i>';

                        if (pageNum === 1) {
                            pageDiv.className += ' cover-front';
                            pageDiv.setAttribute('data-density', 'hard');
                        } else if (pageNum === totalPages) {
                            pageDiv.className += ' cover-back';
                            pageDiv.setAttribute('data-density', 'hard');
                        } else {
                            pageDiv.className += ' halaman-isi';
                        }

                        const contentWrapper = document.createElement('div');
                        contentWrapper.className = pageNum === 1 || pageNum === totalPages ? 'cover-container' : 'page-isi-konten';
                        contentWrapper.appendChild(skeleton);
                        pageDiv.appendChild(contentWrapper);
                        bookContainer.appendChild(pageDiv);
                    }

                    bookContainer.style.display = 'block';
                    buildFlipbookInstance();

                    loadingElement.style.display = 'none';
                    
                    await renderPageQueue(1);

                    window.addEventListener('resize', debounce(() => {
                        if (pageFlip) {
                            pageFlip.update();
                            updateUIState(pageFlip.getCurrentPageIndex());
                        }
                    }, 200));

                } catch (error) {
                    alert("Gagal memuat dokumen: " + error.message);
                    window.location.href = 'index.html';
                }
            }

            function buildFlipbookInstance() {
                const isPortrait = window.innerWidth <= 768 || window.innerHeight > window.innerWidth;
                
                let config = {
                    width: 400,
                    height: 600,
                    size: "stretch",
                    minWidth: 200, maxWidth: 600, minHeight: 300, maxHeight: 900,
                    drawShadow: true,
                    flippingTime: 400
                };

                if (isPortrait) {
                    config.usePortrait = true;
                    config.showCover = false;
                } else {
                    config.usePortrait = false;
                    config.showCover = true;
                }

                pageFlip = new St.PageFlip(bookContainer, config);
                const generatedPages = bookContainer.querySelectorAll('.page');
                pageFlip.loadFromHTML(generatedPages);

                updateUIState(pageFlip.getCurrentPageIndex());

                pageFlip.on('flip', (e) => {
                    updateUIState(e.data);
                    renderPageQueue(e.data + 1);
                });
            }

            async function renderPageQueue(activePage) {
                const pagesToRender = new Set([activePage]);
                if (activePage + 1 <= totalPages) pagesToRender.add(activePage + 1);
                if (activePage + 2 <= totalPages) pagesToRender.add(activePage + 2);
                if (activePage - 1 >= 1) pagesToRender.add(activePage - 1);

                for (const pageNum of pagesToRender) {
                    if (!renderedPages.has(pageNum)) {
                        renderedPages.set(pageNum, 'loading');
                        renderSinglePage(pageNum).then(success => {
                            if(success) renderedPages.set(pageNum, 'done');
                            else renderedPages.delete(pageNum);
                        });
                    }
                }
            }

            async function renderSinglePage(pageNum) {
                try {
                    const page = await pdfDoc.getPage(pageNum);
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    const viewport = page.getViewport({ scale: 1.8 });
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.getElementById(`page-container-${pageNum}`);
                    if (pageDiv) {
                        const targetWrapper = pageDiv.querySelector('.page-isi-konten') || pageDiv.querySelector('.cover-container');
                        const skeleton = targetWrapper.querySelector('.page-skeleton');
                        
                        if (!targetWrapper.querySelector('canvas')) {
                            targetWrapper.appendChild(canvas);
                        }
                        if (skeleton) skeleton.remove();
                    }
                    return true;
                } catch (err) { return false; }
            }

            function updateUIState(currentIndex) {
                inputPage.value = currentIndex + 1;
                if (isZoomed) return;

                const isPortrait = window.innerWidth <= 768 || window.innerHeight > window.innerWidth;
                
                if (isPortrait) {
                    bookContainer.style.transform = "translateX(0)";
                } else {
                    if (currentIndex === 0) {
                        bookContainer.style.transform = "translateX(-25%)";
                    } else if (currentIndex === totalPages - 1) {
                        bookContainer.style.transform = "translateX(25%)";
                    } else {
                        bookContainer.style.transform = "translateX(0)";
                    }
                }
                
                btnHome.disabled = (currentIndex === 0);
                btnPrev.disabled = (currentIndex === 0);
                btnNext.disabled = (currentIndex === totalPages - 1);
                btnEnd.disabled = (currentIndex === totalPages - 1);
            }

            btnHome.onclick = () => { if(!isZoomed) pageFlip.turnToPage(0); };
            btnEnd.onclick = () => { if(!isZoomed) pageFlip.turnToPage(totalPages - 1); };
            btnNext.onclick = () => { if(!isZoomed) pageFlip.flipNext(); };
            btnPrev.onclick = () => { if(!isZoomed) pageFlip.flipPrev(); };

            inputPage.onchange = function() {
                if (isZoomed) return;
                let val = parseInt(this.value);
                if (!isNaN(val) && val >= 1 && val <= totalPages) {
                    let targetIndex = val - 1;
                    
                    renderPageQueue(val).then(() => {
                        pageFlip.turnToPage(targetIndex);
                        updateUIState(targetIndex);
                    });
                } else {
                    this.value = pageFlip.getCurrentPageIndex() + 1;
                }
            };
            inputPage.onkeyup = function(e) {
                if (e.key === 'Enter') { this.blur(); }
            };

            // --- PAN DRAG & TOUCH SCREEN ---
            let isDragging = false; let startX, startY, scrollLeft, scrollTop;

            zoomShield.onmousedown = (e) => {
                if (!isZoomed) return;
                isDragging = true; startX = e.pageX - zoomViewport.offsetLeft; startY = e.pageY - zoomViewport.offsetTop;
                scrollLeft = zoomViewport.scrollLeft; scrollTop = zoomViewport.scrollTop;
            };
            zoomShield.onmouseleave = zoomShield.onmouseup = () => { isDragging = false; };
            zoomShield.onmousemove = (e) => {
                if (!isDragging || !isZoomed) return; e.preventDefault();
                zoomViewport.scrollLeft = scrollLeft - ((e.pageX - zoomViewport.offsetLeft) - startX) * 1.5;
                zoomViewport.scrollTop = scrollTop - ((e.pageY - zoomViewport.offsetTop) - startY) * 1.5;
            };

            zoomShield.addEventListener('touchstart', (e) => {
                if (!isZoomed) return;
                isDragging = true;
                startX = e.touches[0].pageX - zoomViewport.offsetLeft;
                startY = e.touches[0].pageY - zoomViewport.offsetTop;
                scrollLeft = zoomViewport.scrollLeft;
                scrollTop = zoomViewport.scrollTop;
            }, { passive: true });

            zoomShield.addEventListener('touchend', () => { isDragging = false; });
            zoomShield.addEventListener('touchcancel', () => { isDragging = false; });

            zoomShield.addEventListener('touchmove', (e) => {
                if (!isDragging || !isZoomed) return;
                e.preventDefault(); 
                const walkX = ((e.touches[0].pageX - zoomViewport.offsetLeft) - startX) * 1.5;
                const walkY = ((e.touches[0].pageY - zoomViewport.offsetTop) - startY) * 1.5;
                zoomViewport.scrollLeft = scrollLeft - walkX;
                zoomViewport.scrollTop = scrollTop - walkY;
            }, { passive: false });

            btnZoom.onclick = function() {
                isZoomed = !isZoomed;
                if (isZoomed) {
                    zoomViewport.classList.add('zoom-mode');
                    screenContainer.classList.add('zoomed');
                    zoomShield.classList.add('active');
                    this.innerHTML = '<i class="fa-solid fa-magnifying-glass-minus"></i>';
                    btnHome.disabled = btnPrev.disabled = btnNext.disabled = btnEnd.disabled = true;
                    inputPage.disabled = true;
                    setTimeout(() => {
                        zoomShield.style.width = (screenContainer.offsetWidth * 2) + 'px';
                        zoomShield.style.height = (screenContainer.offsetHeight * 2) + 'px';
                    }, 50);
                } else {
                    screenContainer.classList.remove('zoomed');
                    zoomViewport.classList.remove('zoom-mode');
                    zoomShield.classList.remove('active');
                    this.innerHTML = '<i class="fa-solid fa-magnifying-glass-plus"></i>';
                    inputPage.disabled = false;
                    zoomViewport.scrollLeft = zoomViewport.scrollTop = 0;
                    updateUIState(pageFlip.getCurrentPageIndex());
                }
            };

            btnFullscreen.onclick = () => {
                if (!document.fullscreenElement) {
                    document.body.requestFullscreen().then(() => { 
                        btnFullscreen.innerHTML = '<i class="fa-solid fa-compress"></i>'; 
                    }).catch(() => {
                        document.documentElement.requestFullscreen();
                    });
                } else { 
                    document.exitFullscreen(); 
                }
            };
            
            document.onfullscreenchange = () => { 
                if (!document.fullscreenElement) {
                    btnFullscreen.innerHTML = '<i class="fa-solid fa-expand"></i>'; 
                }
                if (pageFlip) {
                    setTimeout(() => {
                        pageFlip.update();
                        updateUIState(pageFlip.getCurrentPageIndex());
                    }, 150);
                }
            };

            function debounce(func, delay) {
                let timer; return function(...args) { clearTimeout(timer); timer = setTimeout(() => func.apply(this, args), delay); };
            }
        });
                // GLOBAL BULLETPROOF SECURITY LAYER
        (function() {
            window.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); }, true);
            window.addEventListener('keydown', function(e) {
                if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); }
                if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
                if (e.ctrlKey && ['U', 'S', 'A', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
            }, true);
        })();
    </script>
</body>
</html>
